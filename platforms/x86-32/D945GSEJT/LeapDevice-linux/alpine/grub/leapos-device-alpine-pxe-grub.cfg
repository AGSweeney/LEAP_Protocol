# LeapOS-Device Alpine PXE — D945GSEJT (Atom N270, i386)
# TFTP prefix: /leapos-device-alpine (see make-pxe-device-alpine.sh)
# modloop is fetched over HTTP at boot — set LEAP_PXE_HTTP_BASE when staging.

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console

set default=0
set timeout=3
set root=(tftp)

menuentry "LeapOS-Device Alpine (COM1 @ 115200)" {
    echo "LeapOS-Device Alpine PXE: loading kernel..."
    linux /leapos-device-alpine/vmlinuz-lts @KERNEL_APPEND@
    initrd /leapos-device-alpine/initramfs-lts
    boot
}
