# LeapOS-Device — D945GSEJT (Atom N270 / Intel 945GSE IGP)
#
# Device-only image: boots leap-port.exe by default.
# Serial: COM1 @ 115200 8N1 (default boot entry).

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console

set default=0
set timeout=0
set timeout_style=hidden

menuentry "LeapOS-Device (serial COM1 @ 115200)" {
    echo "LeapOS-Device: starting (COM1 115200)..."
    multiboot /leap-port.exe --video=off --console=/dev/com1,115200 --printk=/dev/com1,115200
    boot
}

menuentry "LeapOS-Device (VGA text)" {
    echo "LeapOS-Device: starting (VGA)..."
    multiboot /leap-port.exe --video=off --console=/dev/vgacons --printk=/dev/vgacons --disable-com1-com4
    boot
}
