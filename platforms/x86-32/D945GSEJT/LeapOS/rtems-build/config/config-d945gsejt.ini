# D945GSEJT + Atom N270 — pc386 BSP notes for LeapOS VGA
#
# RTEMS 6.2 pc386 requires USE_VBE_RM=True unless USE_VGA or USE_CIRRUS is enabled.
# USE_VGA=True currently fails to compile on RTEMS 6.2 with modern GCC.
#
# For 945GSE integrated graphics, always boot with:
#   --video=off --console=/dev/vgacons --printk=/dev/vgacons --disable-com1-com4
#
# This skips VBE init at runtime and uses VGA text mode (vgacons).
#
# This file documents intended overrides; the live toolchain may still use
# ~/rtems/build/config.ini from the original RSB build.

[i386/pc386]
RTEMS_BUILD_LABEL = D945GSEJT-VGA
USE_VBE_RM = True
USE_VGA = False
BSP_ENABLE_VGA = True
BSP_PRESS_KEY_FOR_RESET = 0
BSP_RESET_BOARD_AT_EXIT = 0
