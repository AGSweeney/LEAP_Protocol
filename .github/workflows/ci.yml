name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify Linux examples
        run: |
          test -x build/leap_linux_controller
          test -x build/leap_linux_device
          test -x build/leap_linux_discover
          test -x build/leap_tests

      - name: Wire smoke (loopback)
        env:
          LEAP_WIRE_STARTUP_S: "2"
          LEAP_WIRE_SMOKE_REQUIRED: "1"
        run: |
          chmod +x tools/ci/wire_smoke_lo.sh
          ip link show lo
          LEAP_BUILD_DIR="$PWD/build" tools/ci/wire_smoke_lo.sh

      - name: Wire smoke (multi-device discovery)
        env:
          LEAP_WIRE_SMOKE_REQUIRED: "1"
        run: |
          chmod +x tools/ci/wire_smoke_discover_lo.sh
          LEAP_BUILD_DIR="$PWD/build" tools/ci/wire_smoke_discover_lo.sh

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
